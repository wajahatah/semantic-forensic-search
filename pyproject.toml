[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfs"
version = "0.1.0"
description = "Semantic forensic search: cost-bounded natural-language retrieval over surveillance video"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "opencv-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights / runs real encoders (run with -m slow)"]
addopts = "-m 'not slow'"
